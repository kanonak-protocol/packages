name: Deploy site

# Every push to main deploys kanonak.org from this repository. One `kanonak publish`, by the CLI .github/kanonak-cli
# pins, renders the whole origin: every package and resource page, and what a client reads, the discovery document,
# kanonak.lock, and each version's source and release lock. GitHub Pages serves it at the domain this repository's
# Pages settings name. The deploy lives beside the packages so a merge is live in minutes, with no token and no
# schedule: a schedule in another repository ran 4 or 5 times a day (kanonak.org#12).
#
# A publish reads what kanonak.org serves first, and refuses one that drops or changes a version it serves, so a run
# against an origin that answers nothing checks every version as new.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Only main's packages: a run dispatched from another branch would publish what isn't merged.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install the Kanonak CLI
        run: npm ci --prefix .github/kanonak-cli

      - name: Render the origin
        run: .github/kanonak-cli/node_modules/.bin/kanonak publish --workspace . --publisher kanonak.org --out "$RUNNER_TEMP/site"

      - name: Record the commit it was built from
        # So anyone can see which commit of this repository kanonak.org serves.
        run: git rev-parse HEAD > "$RUNNER_TEMP/site/packages-commit.txt"

      - name: Serve the tree as it is
        # Without Jekyll, GitHub Pages serves .well-known/ and every other dot or underscore path verbatim.
        run: touch "$RUNNER_TEMP/site/.nojekyll"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
