name: Release locks

# Every version kanonak.org serves has its release lock (kanonak-protocol's
# release-lock-rule): the closure it resolved when it was published, recorded
# once beside its source as {version}.kanonak.lock, and served at
# https://kanonak.org/{package}/{version}/kanonak.lock. A version merged
# without one answers 404 there, so this check refuses it. When adding a
# version, run `kanonak release-lock` and commit what it writes.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install the Kanonak CLI
        # Its package-lock.json names it exactly: a new CLI reaches this check
        # only by a reviewed change to the lock.
        run: npm ci --prefix .github/release-lock-check

      - name: Every published version has its release lock
        run: .github/release-lock-check/node_modules/.bin/kanonak release-lock --check
