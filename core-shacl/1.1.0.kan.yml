core-shacl:
  type: Package
  publisher: kanonak.org
  version: 1.1.0
  label: Core SHACL
  comment: >-
    A scoped Shapes Constraint Language vocabulary. It carries exactly the
    constraints a code generator, schema-aware tools, and a conformance
    evaluator consume — cardinality, closed value sets, string/number facets,
    node kinds, and closed-world property sets — over a single-predicate path,
    plus structural targeting (targetSubjectsOf, targetObjectsOf, targetNode)
    and the validation-report vocabulary (ValidationReport, ValidationResult)
    that lets a conformance verdict be authored, hashed, and signed as graph
    data. Logical combinators, shape composition, SPARQL constraints, and
    multi-step paths remain intentionally out of scope. Shapes are read by
    buildOntologyModel to enrich the resolved type-model, validated by the
    ShaclShape rule, and evaluated against instance data over an explicit
    data scope — closed means closed over the supplied scope, never the
    ambient open world.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.0.0
          alias: rdfs
        - package: core-xsd
          match: ^
          version: 1.0.0
          alias: xsd

Shape:
  type: rdfs.Class
  label: Shape
  comment: >-
    The base class of shapes. A shape carries constraints; concrete shapes are
    either a NodeShape (constraining a node/class) or a PropertyShape
    (constraining the values of one property on a node).
  subClassOf: rdfs.Resource

NodeShape:
  type: rdfs.Class
  label: Node Shape
  comment: >-
    A shape that targets a class (via targetClass) and groups the
    PropertyShapes that constrain that class's properties.
  subClassOf: Shape

PropertyShape:
  type: rdfs.Class
  label: Property Shape
  comment: >-
    A shape that constrains the values of a single property (named by path) on
    the nodes its enclosing NodeShape targets.
  subClassOf: Shape

targetClass:
  type: rdfs.Property
  label: Target Class
  comment: The class that a NodeShape applies to.
  domain: NodeShape
  range: rdfs.Class

property:
  type: rdfs.Property
  label: Property
  comment: A PropertyShape that constrains one of the target class's properties.
  domain: NodeShape
  range: PropertyShape

path:
  type: rdfs.Property
  label: Path
  comment: >-
    The property whose values this PropertyShape constrains. Scoped here to a
    single predicate (no SHACL path expressions).
  domain: PropertyShape
  range: rdfs.Property

minCount:
  type: rdfs.Property
  label: Min Count
  comment: >-
    Minimum number of values for the property. minCount >= 1 makes the property
    required (generated as non-optional); 0 or unspecified means optional.
  domain: PropertyShape
  range: xsd.nonNegativeInteger

maxCount:
  type: rdfs.Property
  label: Max Count
  comment: >-
    Maximum number of values for the property. maxCount = 1 makes the property
    single-valued; greater than 1 or unspecified means a list.
  domain: PropertyShape
  range: xsd.nonNegativeInteger

datatype:
  type: rdfs.Property
  label: Datatype
  comment: The datatype that each value of the property must carry (e.g. xsd:string).
  domain: PropertyShape
  range: rdfs.Datatype

class:
  type: rdfs.Property
  label: Class
  comment: The class that each value of the property must be an instance of.
  domain: PropertyShape
  range: rdfs.Class

in:
  type: rdfs.Property
  label: In
  comment: >-
    The closed set of permitted values for the property, as an rdf:List.
    Generated as a literal union type.
  domain: PropertyShape
  range: rdfs.List

pattern:
  type: rdfs.Property
  label: Pattern
  comment: A regular expression every value of the property must match.
  domain: PropertyShape
  range: xsd.string

flags:
  type: rdfs.Property
  label: Flags
  comment: Optional regular-expression flags applied to pattern (e.g. "i").
  domain: PropertyShape
  range: xsd.string

minLength:
  type: rdfs.Property
  label: Min Length
  comment: Minimum string length of each value.
  domain: PropertyShape
  range: xsd.nonNegativeInteger

maxLength:
  type: rdfs.Property
  label: Max Length
  comment: Maximum string length of each value.
  domain: PropertyShape
  range: xsd.nonNegativeInteger

minInclusive:
  type: rdfs.Property
  label: Min Inclusive
  comment: Inclusive lower bound for numeric values.
  domain: PropertyShape
  range: rdfs.Literal

maxInclusive:
  type: rdfs.Property
  label: Max Inclusive
  comment: Inclusive upper bound for numeric values.
  domain: PropertyShape
  range: rdfs.Literal

message:
  type: rdfs.Property
  label: Message
  comment: >-
    Human-readable text used as the validation error when a constraint on this
    shape is violated. Emitted into generated validators.
  domain: Shape
  range: xsd.string

targetNode:
  type: rdfs.Property
  label: Target Node
  comment: >-
    A specific node this shape applies to, named directly. The most precise
    target: the focus set is exactly the listed nodes, independent of their
    types. Mirrors sh:targetNode.
  domain: NodeShape
  range: rdfs.Resource

targetSubjectsOf:
  type: rdfs.Property
  label: Target Subjects Of
  comment: >-
    The shape applies to every node that is the SUBJECT of a statement whose
    predicate is the given property. Structural targeting: the focus set is
    gathered from how nodes are used, not what they are typed as — which is
    what governance asserted open-world onto terms the asserting package does
    not own requires (targetSubjectsOf rdfs.domain selects every declared
    property, with no reliance on class membership). Mirrors
    sh:targetSubjectsOf.
  domain: NodeShape
  range: rdfs.Property

targetObjectsOf:
  type: rdfs.Property
  label: Target Objects Of
  comment: >-
    The shape applies to every node that is the OBJECT of a statement whose
    predicate is the given property. The object-position counterpart of
    targetSubjectsOf. Mirrors sh:targetObjectsOf.
  domain: NodeShape
  range: rdfs.Property

closed:
  type: rdfs.Property
  label: Closed
  comment: >-
    When true, nodes in the focus set may carry ONLY the properties named by
    this shape's PropertyShape paths (plus any in ignoredProperties) — an
    undeclared property is a violation. The closed-world boundary check.
    Closedness is always evaluated over the EXPLICIT data scope the evaluator
    was given, never the ambient open world: what counts as "the statements
    about this node" is exactly the supplied scope, so an ingress payload is
    judged on its own statements and a pinned load-set on the merged
    statements of that set. Mirrors sh:closed.
  domain: NodeShape
  range: xsd.boolean

ignoredProperties:
  type: rdfs.Property
  label: Ignored Properties
  comment: >-
    Properties exempt from a closed shape, as an rdf:List — most commonly
    rdfs.type, which every typed node carries. Only meaningful alongside
    closed: true. Mirrors sh:ignoredProperties.
  domain: NodeShape
  range: rdfs.List

NodeKind:
  type: rdfs.Class
  label: Node Kind
  comment: >-
    The closed set of node kinds a nodeKind constraint can require. The three
    members mirror the W3C kinds and map onto the Kanonak value trichotomy:
    IRI is a reference to a named resource, BlankNode is an embedded
    (anonymous) resource, Literal is a datatype value. Mirrors sh:NodeKind.
  subClassOf: rdfs.Resource

IRI:
  type: NodeKind
  label: IRI
  comment: >-
    The value must be a reference to a named resource (in Kanonak terms, a
    reference resolving to a canonical URI). Mirrors sh:IRI.

BlankNode:
  type: NodeKind
  label: Blank Node
  comment: >-
    The value must be an embedded (anonymous) resource — a node with no
    canonical URI of its own. Mirrors sh:BlankNode.

Literal:
  type: NodeKind
  label: Literal
  comment: >-
    The value must be a datatype value (string, number, boolean, date, ...).
    Mirrors sh:Literal.

nodeKind:
  type: rdfs.Property
  label: Node Kind
  comment: >-
    The kind of node every value of the property must be — a reference, an
    embedded resource, or a literal. Coarser than datatype/class and
    orthogonal to both: nodeKind Literal with no datatype permits any
    literal; nodeKind IRI with no class permits any reference. Mirrors
    sh:nodeKind.
  domain: PropertyShape
  range: NodeKind

severity:
  type: rdfs.Property
  label: Severity
  comment: >-
    The severity a violation of this shape carries in a validation report.
    Defaults to Violation when absent. Mirrors sh:severity.
  domain: Shape
  range: Severity

Severity:
  type: rdfs.Class
  label: Severity
  comment: >-
    The closed set of result severities. Mirrors sh:Severity.
  subClassOf: rdfs.Resource

Violation:
  type: Severity
  label: Violation
  comment: The default severity — the constraint is broken. Mirrors sh:Violation.

Warning:
  type: Severity
  label: Warning
  comment: A non-fatal finding. Mirrors sh:Warning.

Info:
  type: Severity
  label: Info
  comment: An informational finding. Mirrors sh:Info.

ValidationReport:
  type: rdfs.Class
  label: Validation Report
  comment: >-
    The outcome of evaluating a shapes graph against a data scope, as graph
    data: a conforms verdict plus one ValidationResult per finding. Because a
    report is an authored resource rather than tool prose, it is
    round-trippable by any SHACL tool, queryable like any other graph data,
    and can be content-hashed and signed into a provenance chain. A
    conforming evaluation is a report with conforms true and no results.
    Mirrors sh:ValidationReport.
  subClassOf: rdfs.Resource

conforms:
  type: rdfs.Property
  label: Conforms
  comment: >-
    True when the evaluated data scope satisfies every shape — equivalently,
    when the report carries no results at Violation severity. Mirrors
    sh:conforms.
  domain: ValidationReport
  range: xsd.boolean

result:
  type: rdfs.Property
  label: Result
  comment: >-
    A ValidationResult carried by this report. One result per violated
    constraint per focus node. Mirrors sh:result.
  domain: ValidationReport
  range: ValidationResult

ValidationResult:
  type: rdfs.Class
  label: Validation Result
  comment: >-
    One finding: which focus node, which property path, which constraint
    component, at what severity, with what offending value and message. The
    structured, machine-checkable refusal — the report names exactly what
    failed and why, by URI, not by prose. Mirrors sh:ValidationResult.
  subClassOf: rdfs.Resource

focusNode:
  type: rdfs.Property
  label: Focus Node
  comment: >-
    The node that failed the constraint. Mirrors sh:focusNode.
  domain: ValidationResult
  range: rdfs.Resource

resultPath:
  type: rdfs.Property
  label: Result Path
  comment: >-
    The property whose values violated the constraint. Absent for node-level
    findings (e.g. a closed-shape violation reports the offending property
    itself as the value). Mirrors sh:resultPath.
  domain: ValidationResult
  range: rdfs.Property

resultMessage:
  type: rdfs.Property
  label: Result Message
  comment: >-
    Human-readable description of the finding — the PropertyShape's message
    when it declares one, else evaluator-generated text. Mirrors
    sh:resultMessage.
  domain: ValidationResult
  range: xsd.string

resultSeverity:
  type: rdfs.Property
  label: Result Severity
  comment: >-
    The severity of this finding — the source shape's declared severity, or
    Violation by default. Mirrors sh:resultSeverity.
  domain: ValidationResult
  range: Severity

sourceShape:
  type: rdfs.Property
  label: Source Shape
  comment: >-
    The shape whose constraint produced this finding. Mirrors sh:sourceShape.
  domain: ValidationResult
  range: Shape

value:
  type: rdfs.Property
  label: Value
  comment: >-
    The offending value — the specific value that violated the constraint,
    when one exists (a minCount violation has none). rdfs.Resource is the
    upper bound covering references and literals alike. Mirrors sh:value.
  domain: ValidationResult
  range: rdfs.Resource

sourceConstraintComponent:
  type: rdfs.Property
  label: Source Constraint Component
  comment: >-
    WHICH kind of constraint failed, as a reference to a ConstraintComponent
    member — the discriminant that makes a report operable without parsing
    messages. Mirrors sh:sourceConstraintComponent.
  domain: ValidationResult
  range: ConstraintComponent

ConstraintComponent:
  type: rdfs.Class
  label: Constraint Component
  comment: >-
    The closed set of constraint kinds this scoped vocabulary evaluates. One
    member per constraint parameter, named after its W3C counterpart, so a
    ValidationResult can state by URI exactly which constraint failed.
    Mirrors sh:ConstraintComponent.
  subClassOf: rdfs.Resource

MinCountConstraintComponent:
  type: ConstraintComponent
  label: Min Count Constraint Component
  comment: A minCount violation. Mirrors sh:MinCountConstraintComponent.

MaxCountConstraintComponent:
  type: ConstraintComponent
  label: Max Count Constraint Component
  comment: A maxCount violation. Mirrors sh:MaxCountConstraintComponent.

DatatypeConstraintComponent:
  type: ConstraintComponent
  label: Datatype Constraint Component
  comment: A datatype violation. Mirrors sh:DatatypeConstraintComponent.

ClassConstraintComponent:
  type: ConstraintComponent
  label: Class Constraint Component
  comment: A class violation. Mirrors sh:ClassConstraintComponent.

InConstraintComponent:
  type: ConstraintComponent
  label: In Constraint Component
  comment: An in (closed value set) violation. Mirrors sh:InConstraintComponent.

PatternConstraintComponent:
  type: ConstraintComponent
  label: Pattern Constraint Component
  comment: A pattern violation. Mirrors sh:PatternConstraintComponent.

MinLengthConstraintComponent:
  type: ConstraintComponent
  label: Min Length Constraint Component
  comment: A minLength violation. Mirrors sh:MinLengthConstraintComponent.

MaxLengthConstraintComponent:
  type: ConstraintComponent
  label: Max Length Constraint Component
  comment: A maxLength violation. Mirrors sh:MaxLengthConstraintComponent.

MinInclusiveConstraintComponent:
  type: ConstraintComponent
  label: Min Inclusive Constraint Component
  comment: A minInclusive violation. Mirrors sh:MinInclusiveConstraintComponent.

MaxInclusiveConstraintComponent:
  type: ConstraintComponent
  label: Max Inclusive Constraint Component
  comment: A maxInclusive violation. Mirrors sh:MaxInclusiveConstraintComponent.

NodeKindConstraintComponent:
  type: ConstraintComponent
  label: Node Kind Constraint Component
  comment: A nodeKind violation. Mirrors sh:NodeKindConstraintComponent.

ClosedConstraintComponent:
  type: ConstraintComponent
  label: Closed Constraint Component
  comment: >-
    A closed-shape violation - the focus node carries a property the shape
    does not declare. Mirrors sh:ClosedConstraintComponent.
